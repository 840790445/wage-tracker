<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0b1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <!-- 硬币主体 -->
  <circle cx="256" cy="256" r="140" fill="#FFD700" stroke="#b8960a" stroke-width="8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#b8960a" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- ¥ 符号 -->
  <text x="256" y="310" text-anchor="middle" font-size="140" font-weight="900" fill="#1a1a2e" font-family="sans-serif">¥</text>
  <!-- 装饰小星 -->
  <text x="140" y="180" font-size="32" fill="#FFD700">✦</text>
  <text x="370" y="180" font-size="32" fill="#FFD700">✦</text>
  <text x="160" y="380" font-size="24" fill="#FFD700">✧</text>
  <text x="360" y="380" font-size="24" fill="#FFD700">✧</text>
</svg>