name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的代码
      - uses: actions/checkout@v4
      
      # 2. 准备 Java 环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # 3. 准备安卓 SDK 和命令行工具 (这一步最关键，用的是官方推荐的方式)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # 4. 自动生成 R.java 和资源文件 (这是最容易手动写错的地方，交给脚本自动做)
      - name: Generate Resources
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">工资追踪器</string></resources>' > android/app/src/main/res/values/strings.xml
          echo '<resources><item name="ic_launcher" type="drawable">icon</item></resources>' > android/app/src/main/res/values/themes.xml
          cp icon-192.png android/app/src/main/res/drawable/icon.png
          
      # 5. 把所有文件打包成一个 Jar 包 (手动打包很容易漏文件，用 zip 命令最稳妥)
      - name: Package Assets
        run: |
          cd android/app/src/main/assets
          zip -r ../all-assets.zip *
          cd ../../../../..
          
      # 6. 编译、打包、签名一条龙服务 (这才是真正的打包命令)
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
      
      # 7. 把做好的 APK 传出来给你下载
      - uses: actions/upload-artifact@v4
        with:
          name: 工资追踪器安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
