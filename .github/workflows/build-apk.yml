name: Build Android APK

on:
  push:
    branches: [ main ] # 每次向 main 分支提交代码时触发
  workflow_dispatch:   # 允许在网页上手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的代码
      - uses: actions/checkout@v4
      
      # 2. 准备安卓打包环境（Java 和 SDK）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # 3. 将你的 HTML 包装成一个最简单的安卓项目
      - name: Create Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp wage_tracker.html android/app/src/main/assets/index.html
          
          cat > android/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true" android:label="工资追踪器" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat > android/app/src/main/java/com/example/wagetracker/MainActivity.java <<EOF
          package com.example.wagetracker;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF
          
          cat > android/build.gradle <<EOF
          apply plugin: 'com.android.application'
          repositories { jcenter() }
          android {
              compileSdkVersion 30
              defaultConfig { applicationId "com.example.wagetracker" versionCode 1 versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.3.1' }
          EOF
      
      # 4. 正式打包生成 APK
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
      
      # 5. 把生成的安装包上传出来供你下载
      - uses: actions/upload-artifact@v4
        with:
          name: 我的工资APP安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
