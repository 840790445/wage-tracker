<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工资累积器">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>💰 工资累积器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-dark: #0b1020;
    --bg-card: rgba(255,255,255,0.06);
    --gold: #FFD700;
    --gold-soft: #f0c75e;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
    --text: #e8eaf0;
    --text-dim: #9ca3af;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 600px 400px at 20% 10%, rgba(255,215,0,0.08), transparent),
      radial-gradient(ellipse 500px 500px at 80% 80%, rgba(74,222,128,0.06), transparent),
      linear-gradient(180deg, #0b1020 0%, #0d1530 50%, #0b1020 100%);
  }

  .coin-layer {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
  }
  .coin {
    position: absolute; top: -60px;
    font-size: 28px;
    animation: fall linear forwards;
    will-change: transform, opacity;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
  }
  .coin.big { font-size: 40px; }
  .coin.small { font-size: 20px; }

  .app {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px);
  }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 4px 14px;
  }
  .top-bar .title {
    font-size: 13px; color: var(--text-dim); letter-spacing: 1px;
  }
  .top-bar .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 999px;
    background: rgba(74,222,128,0.15); color: var(--green);
    border: 1px solid rgba(74,222,128,0.3);
    transition: all 0.3s;
  }
  .top-bar .badge.paused { background: rgba(248,113,113,0.15); color: var(--red); border-color: rgba(248,113,113,0.3); }
  .top-bar .badge.waiting { background: rgba(96,165,250,0.15); color: var(--blue); border-color: rgba(96,165,250,0.3); }

  .hero {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .label { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }
  .amount {
    font-size: clamp(44px, 12vw, 72px);
    font-weight: 800;
    color: var(--gold);
    line-height: 1.1;
    text-shadow: 0 0 24px rgba(255,215,0,0.35), 0 2px 0 #b8960a;
    transition: transform 0.15s ease;
    font-variant-numeric: tabular-nums;
  }
  .amount.bump { transform: scale(1.06); }
  .sub { margin-top: 10px; font-size: 13px; color: var(--text-dim); }
  .sub span { color: var(--text); font-weight: 600; }

  .progress-wrap { width: 100%; max-width: 420px; margin: 14px auto 0; }
  .progress-row {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-dim); margin-bottom: 4px;
  }
  .progress-bar {
    height: 8px; border-radius: 999px;
    background: rgba(255,255,255,0.08); overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--gold), #fff5b4);
    width: 0%;
    transition: width 0.6s ease;
    box-shadow: 0 0 12px rgba(255,215,0,0.5);
  }

  .stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px; margin: 16px 0;
  }
  .stat-card {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 12px 8px; text-align: center;
  }
  .stat-card .v { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat-card .v.gold { color: var(--gold); }
  .stat-card .v.green { color: var(--green); }
  .stat-card .v.blue { color: var(--blue); }
  .stat-card .l { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .settings {
    background: var(--bg-card);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 14px 14px 8px;
    margin-bottom: 12px;
    max-height: 48vh;
    overflow-y: auto;
  }
  .settings .row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .settings label { font-size: 13px; color: var(--text-dim); min-width: 72px; }
  .settings input[type="number"], .settings input[type="time"] {
    flex: 1; min-width: 0;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    border-radius: 10px; padding: 9px 12px;
    font-size: 15px; font-weight: 600; outline: none;
    -webkit-appearance: none;
  }
  .settings input[type="time"] { color-scheme: dark; font-family: inherit; }
  .settings input:focus { border-color: var(--gold); }

  .time-row { display: flex; gap: 8px; flex: 1; }
  .time-row input { flex: 1; text-align: center; }
  .time-label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 6px;
  }
  .toggle-row .desc { font-size: 12px; color: var(--text-dim); }

  .switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(255,255,255,0.12); border-radius: 999px; transition: 0.25s;
  }
  .slider::before {
    content: ""; position: absolute; height: 20px; width: 20px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%;
    transition: 0.25s; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .switch input:checked + .slider { background: var(--gold); }
  .switch input:checked + .slider::before { transform: translateX(18px); }

  .btn-row { display: flex; gap: 10px; margin-bottom: 6px; }
  .btn {
    flex: 1; padding: 13px; border: none; border-radius: 14px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    color: #1a1a2e; -webkit-user-select: none; user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold-soft)); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); }
  .btn-danger { background: rgba(248,113,113,0.18); color: var(--red); }

  .hint { text-align: center; font-size: 11px; color: var(--text-dim); padding: 6px 0 2px; line-height: 1.6; }
  .hint .highlight { color: var(--green); }

  .milestone {
    position: fixed; left: 50%; top: 38%;
    transform: translate(-50%, -50%) scale(0.7);
    z-index: 99;
    background: linear-gradient(135deg, rgba(255,215,0,0.95), rgba(255,180,0,0.95));
    color: #1a1a2e;
    padding: 22px 36px; border-radius: 22px;
    font-size: 22px; font-weight: 800;
    box-shadow: 0 12px 48px rgba(255,215,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center; white-space: nowrap;
  }
  .milestone.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .milestone .small { font-size: 13px; font-weight: 600; opacity: 0.8; display: block; margin-top: 4px; }

  .float-text {
    position: fixed; z-index: 98; pointer-events: none;
    font-size: 22px; font-weight: 800; color: var(--gold);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    animation: floatUp 1.2s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-80px) scale(1.3); opacity: 0; }
  }

  .countdown-tip { font-size: 12px; color: var(--blue); margin-top: 6px; min-height: 16px; }
  .offline-tip {
    font-size: 11px; color: var(--green); margin-top: 4px; min-height: 14px;
  }

  ::-webkit-scrollbar { display: none; }
  @media (max-width: 480px) {
    .stats { gap: 8px; }
    .stat-card { padding: 10px 6px; }
    .stat-card .v { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="coin-layer" id="coinLayer"></div>

<div class="app">
  <div class="top-bar">
    <div class="title">💰 工资累积器</div>
    <div class="badge" id="statusBadge">● 运行中</div>
  </div>

  <div class="hero">
    <div class="label">已累积工资</div>
    <div class="amount" id="amount">0.00</div>
    <div class="sub">今日已赚 <span id="todayEarned">0.00</span> 元</div>
    <div class="sub" id="workdayInfo" style="margin-top:4px;font-size:12px;"></div>
    <div class="countdown-tip" id="countdownTip"></div>
    <div class="offline-tip" id="offlineTip"></div>

    <div class="progress-wrap">
      <div class="progress-row">
        <span>距下一里程碑</span>
        <span id="nextMilestone">1000 元</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="v gold" id="rateVal">--</div>
      <div class="l">时薪(元/h)</div>
    </div>
    <div class="stat-card">
      <div class="v" id="secondsVal">0</div>
      <div class="l">本次计时(秒)</div>
    </div>
    <div class="stat-card">
      <div class="v green" id="milestoneCount">0</div>
      <div class="l">达成里程碑</div>
    </div>
  </div>

  <div class="settings">
    <div class="row">
      <label>月薪(元)</label>
      <input type="number" id="salaryInput" placeholder="例如 15000" inputmode="numeric">
    </div>
    <div class="row">
      <label>每月天数</label>
      <input type="number" id="daysInput" value="22" min="1" max="31" inputmode="numeric">
    </div>
    <div class="row">
      <label>每天工时</label>
      <input type="number" id="hoursInput" value="8" min="1" max="24" step="0.5" inputmode="numeric">
    </div>
    <div class="row" style="margin-bottom: 4px;">
      <label>工作日</label>
      <div class="time-row" id="weekdayRow" style="gap: 4px; flex-wrap: wrap;"></div>
    </div>
    <div class="row" style="margin-top: -6px; margin-bottom: 12px;">
      <label></label>
      <div class="time-label">勾选你上班的日子</div>
    </div>
    <div class="row" style="margin-bottom: 4px;">
      <label>上下班时间</label>
      <div class="time-row">
        <input type="time" id="startTimeInput" value="09:00">
        <input type="time" id="endTimeInput" value="18:00">
      </div>
    </div>
    <div class="row" style="margin-top: -6px; margin-bottom: 12px;">
      <label></label>
      <div class="time-label">上班时间　　　　　　　下班时间</div>
    </div>
    <div class="row">
      <label>开始上班日期</label>
      <input type="date" id="startWorkDateInput" style="flex:1;min-width:0;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;outline:none;-webkit-appearance:none;color-scheme:dark;font-family:inherit;">
    </div>
    <div class="toggle-row">
      <div>
        <div style="font-size:13px">自动启停</div>
        <div class="desc">按设定时间自动开始/暂停计时</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <div>
        <div style="font-size:13px">后台继续计数</div>
        <div class="desc">关闭页面后重新打开，自动补算工资</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="bgCalcToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <div>
        <div style="font-size:13px">声音提醒</div>
        <div class="desc">每满 1000 元播放金币音效</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="soundToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <div>
        <div style="font-size:13px">震动提醒</div>
        <div class="desc">里程碑时手机震动</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="vibrateToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="pauseBtn">⏸ 暂停</button>
    <button class="btn btn-secondary" id="resetBtn">↺ 重置</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-danger" id="addBtn">＋ 手动加 1000</button>
  </div>

  <div class="hint">
    数据保存在本机浏览器 · 关闭页面后重新打开会自动补算<br>
    设置 <span class="highlight">开始上班日期</span> 后可精确自动校正累计工资
  </div>
</div>

<div class="milestone" id="milestonePopup">
  🎉 里程碑达成！
  <span class="small" id="milestoneText">+1000 元</span>
</div>

<script>
// ========== 常量 ==========
const STORAGE_KEY = 'wage_tracker_v3';
const MILESTONE = 1000;
const DAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

// ========== 状态 ==========
const state = {
  salary: 15000,
  days: 22,
  hours: 8,
  startTime: '09:00',
  endTime: '18:00',
  workdays: [1, 2, 3, 4, 5], // 周一到周五
  startWorkDate: '',          // 开始上班日期 YYYY-MM-DD
  autoMode: true,
  bgCalc: true,               // 后台继续计数
  totalEarned: 0,
  todayEarned: 0,
  lastTick: Date.now(),
  milestoneReached: 0,
  running: true,
  soundOn: true,
  vibrateOn: true,
  sessionStart: Date.now(),
  lastDate: null,
  savedAt: Date.now(),
  // 上次校正的总额快照，用于增量校正
  lastCorrectTotal: 0,
  lastCorrectDate: '',        // 上次校正时的日期
};

// ========== DOM ==========
const $ = (id) => document.getElementById(id);
const amountEl = $('amount');
const todayEl = $('todayEarned');
const rateEl = $('rateVal');
const secondsEl = $('secondsVal');
const milestoneCountEl = $('milestoneCount');
const progressFill = $('progressFill');
const nextMilestoneEl = $('nextMilestone');
const statusBadge = $('statusBadge');
const coinLayer = $('coinLayer');
const milestonePopup = $('milestonePopup');
const countdownTip = $('countdownTip');
const offlineTip = $('offlineTip');

// ========== 音频 ==========
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playCoinSound() {
  if (!state.soundOn) return;
  try {
    const ctx = getAudioCtx(); const t = ctx.currentTime;
    [2200, 3300, 4400, 5500].forEach((f, i) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      const st = t + i * 0.015;
      gain.gain.setValueAtTime(0, st);
      gain.gain.linearRampToValueAtTime(0.12, st + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, st + 0.18);
      osc.connect(gain).connect(ctx.destination);
      osc.start(st); osc.stop(st + 0.2);
    });
    const osc2 = ctx.createOscillator(), gain2 = ctx.createGain();
    osc2.type = 'triangle'; osc2.frequency.value = 660;
    gain2.gain.setValueAtTime(0.15, t);
    gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    osc2.connect(gain2).connect(ctx.destination);
    osc2.start(t); osc2.stop(t + 0.3);
  } catch(e) {}
}

// ========== 金币 ==========
function spawnCoins(count = 18) {
  const existing = coinLayer.querySelectorAll('.coin').length;
  const maxSpawn = Math.min(count, 30 - existing);
  const symbols = ['🪙', '💰', '✨', '🪙', '💵'];
  for (let i = 0; i < maxSpawn; i++) {
    const c = document.createElement('div');
    c.className = 'coin' + (Math.random() < 0.2 ? ' big' : Math.random() < 0.4 ? ' small' : '');
    c.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    c.style.left = Math.random() * 100 + 'vw';
    const dur = 2.5 + Math.random() * 2.5, delay = Math.random() * 0.6;
    c.style.animationDuration = dur + 's'; c.style.animationDelay = delay + 's';
    coinLayer.appendChild(c);
    setTimeout(() => c.remove(), (dur + delay) * 1000 + 200);
  }
}

function showMilestone(amount) {
  $('milestoneText').textContent = '累积 ' + Math.floor(amount) + ' 元 🎊';
  milestonePopup.classList.add('show');
  setTimeout(() => milestonePopup.classList.remove('show'), 2400);
  spawnCoins(30);
  if (state.vibrateOn && navigator.vibrate) navigator.vibrate([200, 80, 200, 80, 300]);
}

// ========== 核心：时间计算 ==========

// 判断某一天是否是工作日
function isWorkday(date) {
  return state.workdays.includes(date.getDay());
}

// 将时间字符串 "HH:MM" 转为当天的 Date 对象
function timeStrToDate(date, timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const d = new Date(date);
  d.setHours(h, m, 0, 0);
  return d;
}

// 计算两个时间点之间，落在"工作时段"内的秒数
// 工作时段 = 工作日(按 workdays) 且 在 [startTime, endTime) 范围内
function calcWorkSecondsBetween(fromTs, toTs) {
  if (fromTs >= toTs) return 0;
  if (state.autoMode === false) {
    // 非自动模式：全部时间都算工时
    return (toTs - fromTs) / 1000;
  }

  const perSec = calcPerSecond();
  if (perSec <= 0) return 0;

  const [sh, sm] = state.startTime.split(':').map(Number);
  const [eh, em] = state.endTime.split(':').map(Number);
  const startMins = sh * 60 + sm;
  const endMins = eh * 60 + em;
  const crossNight = startMins > endMins; // 跨夜班次

  // 逐分钟扫描（精确到分钟足够，避免秒级循环太重）
  let workSecs = 0;
  const stepMs = 60 * 1000; // 1 分钟步长
  let cur = Math.ceil(fromTs / stepMs) * stepMs; // 对齐到分钟边界

  // 优化：按天批量计算
  const fromDate = new Date(fromTs);
  const toDate = new Date(toTs);

  // 从 fromTs 到 toTs，逐天判断
  const dayCursor = new Date(fromDate);
  dayCursor.setHours(0, 0, 0, 0);

  while (dayCursor <= toDate) {
    if (isWorkday(dayCursor)) {
      // 这一天的上班起止时间
      let workStart, workEnd;
      if (crossNight) {
        // 跨夜：今天 startMins 到明天 endMins
        // 简化为：今天 startMins 到今天 24:00 + 明天 00:00 到明天 endMins
        // 这里逐分钟处理更直观
      }

      // 通用做法：用分钟级循环，但仅在工作日内
      const dayStartMs = dayCursor.getTime();
      const dayEndMs = dayStartMs + 24 * 3600 * 1000;

      // 计算今天的工作分钟区间
      let intervals = [];
      if (!crossNight) {
        const ws = dayStartMs + startMins * 60000;
        const we = dayStartMs + endMins * 60000;
        intervals.push([ws, we]);
      } else {
        // 今天 startMins → 今天 24:00
        const ws = dayStartMs + startMins * 60000;
        const we1 = dayStartMs + 24 * 3600 * 1000;
        intervals.push([ws, we1]);
        // 明天 00:00 → 明天 endMins
        const we2Start = dayStartMs + 24 * 3600 * 1000;
        const we2End = we2Start + endMins * 60000;
        intervals.push([we2Start, we2End]);
      }

      for (const [ws, we] of intervals) {
        const overlapStart = Math.max(fromTs, ws);
        const overlapEnd = Math.min(toTs, we);
        if (overlapStart < overlapEnd) {
          workSecs += (overlapEnd - overlapStart) / 1000;
        }
      }
    }
    dayCursor.setDate(dayCursor.getDate() + 1);
  }

  return workSecs;
}

// 判断当前时刻是否在工作时间内（用于实时状态显示）
function nowInWorkHours() {
  if (!state.autoMode) return true;
  const now = new Date();
  if (!isWorkday(now)) return false;
  const cur = now.getHours() * 60 + now.getMinutes();
  const [sh, sm] = state.startTime.split(':').map(Number);
  const [eh, em] = state.endTime.split(':').map(Number);
  const startMins = sh * 60 + sm;
  const endMins = eh * 60 + em;
  if (startMins <= endMins) return cur >= startMins && cur < endMins;
  return cur >= startMins || cur < endMins;
}

function minutesToEnd() {
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  const [eh, em] = state.endTime.split(':').map(Number);
  let diff = eh * 60 + em - cur;
  if (diff < 0) diff += 24 * 60;
  return diff;
}

function minutesToStart() {
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  // 找下一个工作日
  let days = 0;
  let target = new Date(now);
  do {
    target.setDate(target.getDate() + 1);
    days++;
    if (days > 7) break;
  } while (!isWorkday(target));
  const [sh, sm] = state.startTime.split(':').map(Number);
  let diff = sh * 60 + sm - cur;
  // 加上天数偏移
  diff += (days - 1) * 24 * 60;
  if (diff < 0) diff += 24 * 60;
  return diff;
}

// ========== 时薪 ==========
function calcRate() {
  const monthlyHours = state.days * state.hours;
  return monthlyHours > 0 ? state.salary / monthlyHours : 0;
}
function calcPerSecond() { return calcRate() / 3600; }

// ========== 理论总额计算（基于开始上班日期） ==========

// 计算从 startWorkDate 到指定日期(toDateStr 或今天)之间，共有多少个工作日
function countWorkdaysBetween(startDateStr, toDate) {
  if (!startDateStr) return 0;
  const [sy, sm, sd] = startDateStr.split('-').map(Number);
  const start = new Date(sy, sm - 1, sd);
  const end = new Date(toDate);
  end.setHours(0, 0, 0, 0);
  start.setHours(0, 0, 0, 0);

  if (start > end) return 0;

  // 逐天判断
  let count = 0;
  const cur = new Date(start);
  while (cur <= end) {
    if (state.workdays.includes(cur.getDay())) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

// 计算从开始上班到"今天当前时刻"的理论应赚总额
function calcTheoreticalTotal(now) {
  if (!state.startWorkDate) return null; // 未设置开始日期
  const targetTime = now || Date.now();
  const today = new Date(targetTime);

  // 今天日期字符串
  const todayStr = today.toISOString().split('T')[0];

  // 开始日期
  const [sy, sm, sd] = state.startWorkDate.split('-').map(Number);
  const startDate = new Date(sy, sm - 1, sd);
  startDate.setHours(0, 0, 0, 0);

  const todayDateOnly = new Date(today);
  todayDateOnly.setHours(0, 0, 0, 0);

  if (startDate > todayDateOnly) return 0; // 还没开始上班

  // 从开始日期到昨天的工作日数
  const yesterday = new Date(todayDateOnly);
  yesterday.setDate(yesterday.getDate() - 1);
  const fullDays = countWorkdaysBetween(state.startWorkDate, yesterday);

  // 今天是否在上班（且是工作日）
  const todayWorkday = isWorkday(today);
  const todayInWorkHours = todayWorkday && nowInWorkHoursForTime(targetTime);

  // 今天的工时比例
  let todayFraction = 0;
  if (todayWorkday && state.autoMode) {
    // 今天已开始上班的部分比例
    todayFraction = calcTodayWorkFraction(targetTime);
  } else if (!state.autoMode) {
    // 非自动模式：按今天已过的比例
    todayFraction = calcTodayWorkFraction(targetTime);
  }

  const totalWorkDays = fullDays + todayFraction;
  const perDayEarning = calcRate() * state.hours; // 每天赚多少
  return perDayEarning * totalWorkDays;
}

// 计算"今天"已经过了多少比例的工作时间（0~1）
function calcTodayWorkFraction(nowTs) {
  const now = new Date(nowTs);
  const [sh, sm] = state.startTime.split(':').map(Number);
  const [eh, em] = state.endTime.split(':').map(Number);
  const startMins = sh * 60 + sm;
  const endMins = eh * 60 + em;

  if (state.autoMode === false) {
    // 非自动模式：按一天24h的比例
    return now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() / 86400;
  }

  if (startMins >= endMins) {
    // 跨夜班次：简化为只看今天已过比例
    const totalMins = 24 * 60;
    const curMins = now.getHours() * 60 + now.getMinutes();
    return Math.min(1, curMins / totalMins);
  }

  const curMins = now.getHours() * 60 + now.getMinutes();
  if (curMins < startMins) return 0;
  if (curMins >= endMins) return 1;
  return (curMins - startMins) / (endMins - startMins);
}

// 不依赖 state 的 nowInWorkHours 版本（用于理论计算时避免循环依赖）
function nowInWorkHoursForTime(ts) {
  const d = new Date(ts);
  const cur = d.getHours() * 60 + d.getMinutes();
  const [sh, sm] = state.startTime.split(':').map(Number);
  const [eh, em] = state.endTime.split(':').map(Number);
  const startMins = sh * 60 + sm;
  const endMins = eh * 60 + em;
  if (startMins <= endMins) return cur >= startMins && cur < endMins;
  return cur >= startMins || cur < endMins;
}

// ========== 自动校正（核心！） ==========
function autoCorrectFromStartDate() {
  if (!state.startWorkDate) return false;

  const theoretical = calcTheoreticalTotal(Date.now());
  if (theoretical === null) return false;

  const before = state.totalEarned;
  const diff = theoretical - before;

  if (diff > 0.01) {
    // 理论值 > 实际值：补差额
    state.totalEarned = theoretical;

    // todayEarned 的处理：如果今天有数据就只加今天的部分
    const todayStr = new Date().toISOString().split('T')[0];
    const [sh, sm] = state.startTime.split(':').map(Number);
    const [eh, em] = state.endTime.split(':').map(Number);
    const startMins = sh * 60 + sm;
    const endMins = eh * 60 + em;
    let dayFrac = 0;
    if (state.autoMode && startMins < endMins) {
      const now = new Date();
      const cur = now.getHours() * 60 + now.getMinutes();
      if (cur >= startMins && cur < endMins) {
        dayFrac = (cur - startMins) / (endMins - startMins);
      } else if (cur >= endMins) {
        dayFrac = 1;
      }
    } else if (!state.autoMode) {
      const now = new Date();
      dayFrac = (now.getHours() * 60 + now.getMinutes()) / (24 * 60);
    }
    const perDayEarning = calcRate() * state.hours;
    const todayTheoretical = perDayEarning * dayFrac;
    state.todayEarned = Math.max(state.todayEarned, todayTheoretical);

    // 里程碑检测
    checkMilestone(before, state.totalEarned);

    // 提示
    const rounded = Math.round(diff * 100) / 100;
    offlineTip.textContent = `📐 已按上班日期自动校正，补差 +${fmt(rounded)} 元`;
    setTimeout(() => { offlineTip.textContent = ''; }, 6000);

    console.log(`[自动校正] 理论值 ${fmt(theoretical)}，实际 ${fmt(before)}，补差 +${fmt(rounded)}`);
    return true;
  }

  return false;
}

// ========== 跨天 ==========
function checkNewDay() {
  const today = new Date().toISOString().split('T')[0];
  if (state.lastDate && state.lastDate !== today) {
    state.todayEarned = 0;
  }
  state.lastDate = today;
}

// ========== 格式化 ==========
function fmt(n) {
  return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtCountdown(mins) {
  if (mins <= 0) return '';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `还剩 ${h} 小时 ${m} 分钟下班` : `还剩 ${m} 分钟下班`;
}
function fmtDuration(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (h > 0) return `${h}小时${m}分钟`;
  return `${m}分钟`;
}

// ========== 渲染 ==========
function render() {
  const rate = calcRate();
  rateEl.textContent = rate > 0 ? fmt(rate) : '--';
  amountEl.textContent = fmt(state.totalEarned);
  todayEl.textContent = fmt(state.todayEarned);
  secondsEl.textContent = Math.floor((Date.now() - state.sessionStart) / 1000);

  const currentMod = state.totalEarned % MILESTONE;
  const pct = Math.min(100, (currentMod / MILESTONE) * 100);
  progressFill.style.width = pct + '%';
  const nextVal = Math.ceil(state.totalEarned / MILESTONE) * MILESTONE;
  if (state.totalEarned === 0) {
    nextMilestoneEl.textContent = MILESTONE + ' 元';
  } else {
    const remain = nextVal - state.totalEarned;
    nextMilestoneEl.textContent = remain > 0 ? fmt(remain) + ' 元' : '🎉 已达 ' + fmt(nextVal);
  }
  milestoneCountEl.textContent = state.milestoneReached;

  // 上班天数信息
  const workdayInfoEl = $('workdayInfo');
  if (state.startWorkDate) {
    const today = new Date();
    const [sy, sm, sd] = state.startWorkDate.split('-').map(Number);
    const start = new Date(sy, sm - 1, sd);
    const daysPassed = Math.floor((today - start) / (24 * 3600 * 1000)) + 1;
    const workdaysPassed = countWorkdaysBetween(state.startWorkDate, today);
    workdayInfoEl.innerHTML = `自 ${state.startWorkDate} 起 · 第 <span>${workdaysPassed}</span> 个工作日`;
  } else {
    workdayInfoEl.textContent = '⚠️ 请设置"开始上班日期"以启用自动校正';
    workdayInfoEl.style.color = 'var(--gold)';
  }

  // 状态栏
  if (!state.running) {
    statusBadge.textContent = '⏸ 已手动暂停';
    statusBadge.className = 'badge paused';
    countdownTip.textContent = '';
  } else if (state.autoMode && !nowInWorkHours()) {
    if (!isWorkday(new Date())) {
      statusBadge.textContent = '📅 今日非工作日';
    } else {
      statusBadge.textContent = '💤 等待上班';
    }
    statusBadge.className = 'badge waiting';
    const mins = minutesToStart();
    const [sh, sm] = state.startTime.split(':');
    countdownTip.textContent = `${sh}:${sm.padStart(2,'0')} 开始计时（约 ${Math.floor(mins)} 分钟后）`;
  } else {
    statusBadge.textContent = '● 运行中';
    statusBadge.className = 'badge';
    if (state.autoMode) {
      countdownTip.textContent = fmtCountdown(minutesToEnd());
    } else {
      countdownTip.textContent = '自动启停已关闭，24h 计薪中';
    }
  }
}

// ========== 核心 tick（实时增量 + 离线补偿） ==========
function tick() {
  const now = Date.now();
  const dt = (now - state.lastTick) / 1000;
  state.lastTick = now;

  checkNewDay();

  // 实时增量：仅在"正在运行 + 在工作时间内"才用 dt 累加
  let shouldRun = state.running;
  if (shouldRun && state.autoMode) shouldRun = nowInWorkHours();

  if (shouldRun && state.running) {
    // 用精确的"到上一秒为止"的工作秒数来计算
    const workSecsNow = calcWorkSecondsBetween(state.savedAt || now, now);
    // 但其实更简单的做法是：直接按 dt 算，因为 nowInWorkHours 已经保证了当前在工作时间
    const perSec = calcPerSecond();
    const earned = perSec * dt;

    if (earned > 0) {
      const before = state.totalEarned;
      state.totalEarned += earned;
      state.todayEarned += earned;
      checkMilestone(before, state.totalEarned);
      if (Math.random() < 0.08) spawnCoins(2);
    }
  }

  render();
}

// 里程碑检测（抽取出来方便离线补偿也用）
function checkMilestone(before, after) {
  const beforeCount = Math.floor(before / MILESTONE);
  const afterCount = Math.floor(after / MILESTONE);
  const crossed = afterCount - beforeCount;
  if (crossed > 0) {
    state.milestoneReached += crossed;
    const milestoneValue = afterCount * MILESTONE;
    // 延迟播放，避免离线补偿时一次性全播
    setTimeout(() => {
      playCoinSound();
      showMilestone(milestoneValue);
      amountEl.classList.add('bump');
      setTimeout(() => amountEl.classList.remove('bump'), 160);
    }, 500);
  }
}

// ========== 离线补偿（核心！） ==========
function compensateOffline() {
  const now = Date.now();
  const lastSaved = state.savedAt || now;
  const offlineMs = now - lastSaved;

  if (offlineMs < 5000) return; // 小于5秒不处理

  // 计算离线期间的有效工作秒数
  const workSecs = calcWorkSecondsBetween(lastSaved, now);

  if (workSecs > 0) {
    const perSec = calcPerSecond();
    const earned = perSec * workSecs;

    const before = state.totalEarned;
    state.totalEarned += earned;

    // 判断离线期间是否跨越了"今天"
    const lastDateStr = new Date(lastSaved).toISOString().split('T')[0];
    const todayStr = new Date().toISOString().split('T')[0];
    if (state.lastDate === todayStr || lastDateStr === todayStr) {
      state.todayEarned += earned;
    }

    // 里程碑检测
    checkMilestone(before, state.totalEarned);

    // 显示补偿提示
    const durStr = fmtDuration(workSecs);
    offlineTip.textContent = `✅ 已补算离线 ${durStr} 工时，+${fmt(earned)} 元`;
    setTimeout(() => { offlineTip.textContent = ''; }, 6000);

    console.log(`[离线补偿] 离线 ${fmtDuration(offlineMs/1000)}，有效工时 ${durStr}，补算 +${fmt(earned)} 元`);
  } else {
    // 离线期间不在任何工作时段内
    offlineTip.textContent = `💤 离线期间非工作时间，无需补算`;
    setTimeout(() => { offlineTip.textContent = ''; }, 4000);
  }

  // 重置 savedAt 为当前，避免重复补偿
  state.savedAt = now;
}

// ========== 持久化 ==========
function save() {
  const data = {
    salary: state.salary, days: state.days, hours: state.hours,
    startTime: state.startTime, endTime: state.endTime,
    workdays: state.workdays, autoMode: state.autoMode,
    bgCalc: state.bgCalc,
    startWorkDate: state.startWorkDate,
    totalEarned: state.totalEarned, todayEarned: state.todayEarned,
    milestoneReached: state.milestoneReached,
    soundOn: state.soundOn, vibrateOn: state.vibrateOn,
    lastDate: state.lastDate, savedAt: Date.now(),
    lastCorrectTotal: state.totalEarned,
    lastCorrectDate: state.lastCorrectDate,
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  state.savedAt = Date.now();
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.salary) state.salary = d.salary;
    if (d.days) state.days = d.days;
    if (d.hours) state.hours = d.hours;
    if (d.startTime) state.startTime = d.startTime;
    if (d.endTime) state.endTime = d.endTime;
    if (d.workdays && d.workdays.length) state.workdays = d.workdays;
    if (d.startWorkDate) state.startWorkDate = d.startWorkDate;
    if (typeof d.autoMode === 'boolean') state.autoMode = d.autoMode;
    if (typeof d.bgCalc === 'boolean') state.bgCalc = d.bgCalc;
    if (typeof d.totalEarned === 'number') state.totalEarned = d.totalEarned;
    if (typeof d.todayEarned === 'number') state.todayEarned = d.todayEarned;
    if (d.milestoneReached) state.milestoneReached = d.milestoneReached;
    if (typeof d.soundOn === 'boolean') state.soundOn = d.soundOn;
    if (typeof d.vibrateOn === 'boolean') state.vibrateOn = d.vibrateOn;
    if (d.lastDate) state.lastDate = d.lastDate;
    if (d.savedAt) state.savedAt = d.savedAt;
    if (typeof d.lastCorrectTotal === 'number') state.lastCorrectTotal = d.lastCorrectTotal;
    if (d.lastCorrectDate) state.lastCorrectDate = d.lastCorrectDate;
  } catch(e) {}
}

// ========== 工作日选择 UI ==========
function buildWeekdaySelector() {
  const container = $('weekdayRow');
  container.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const chip = document.createElement('div');
    const active = state.workdays.includes(i);
    chip.className = 'weekday-chip' + (active ? ' active' : '');
    chip.textContent = DAY_NAMES[i];
    chip.dataset.day = i;
    chip.addEventListener('click', () => {
      const day = parseInt(chip.dataset.day);
      const idx = state.workdays.indexOf(day);
      if (idx >= 0) {
        if (state.workdays.length > 1) state.workdays.splice(idx, 1);
      } else {
        state.workdays.push(day);
        state.workdays.sort();
      }
      buildWeekdaySelector();
      render();
      save();
    });
    container.appendChild(chip);
  }
}

// ========== 输入绑定 ==========
function bindInputs() {
  const s = $('salaryInput'), d = $('daysInput'), h = $('hoursInput');
  const st = $('startTimeInput'), et = $('endTimeInput');
  const swd = $('startWorkDateInput');
  s.value = state.salary; d.value = state.days; h.value = state.hours;
  st.value = state.startTime; et.value = state.endTime;
  swd.value = state.startWorkDate || '';

  const onNumChange = () => {
    state.salary = parseFloat(s.value) || 0;
    state.days = parseFloat(d.value) || 1;
    state.hours = parseFloat(h.value) || 1;
    render();
  };
  s.addEventListener('input', onNumChange);
  d.addEventListener('input', onNumChange);
  h.addEventListener('input', onNumChange);

  const onTimeChange = () => {
    state.startTime = st.value || '09:00';
    state.endTime = et.value || '18:00';
    render();
  };
  st.addEventListener('change', onTimeChange);
  et.addEventListener('change', onTimeChange);

  // 开始上班日期
  swd.addEventListener('change', () => {
    state.startWorkDate = swd.value || '';
    // 设置/修改日期后立即校正一次
    autoCorrectFromStartDate();
    render();
    save();
  });

  [s, d, h, st, et].forEach(el => el.addEventListener('change', save));

  $('autoToggle').checked = state.autoMode;
  $('autoToggle').addEventListener('change', e => { state.autoMode = e.target.checked; state.lastTick = Date.now(); render(); save(); });

  $('bgCalcToggle').checked = state.bgCalc;
  $('bgCalcToggle').addEventListener('change', e => { state.bgCalc = e.target.checked; save(); });

  $('soundToggle').checked = state.soundOn;
  $('vibrateToggle').checked = state.vibrateOn;
  $('soundToggle').addEventListener('change', e => { state.soundOn = e.target.checked; save(); });
  $('vibrateToggle').addEventListener('change', e => { state.vibrateOn = e.target.checked; save(); });
}

// ========== 按钮 ==========
function bindButtons() {
  const pauseBtn = $('pauseBtn');
  pauseBtn.addEventListener('click', () => {
    state.running = !state.running;
    state.lastTick = Date.now();
    pauseBtn.textContent = state.running ? '⏸ 暂停' : '▶ 继续';
    render(); save();
  });

  $('resetBtn').addEventListener('click', () => {
    if (!confirm('确定要重置累积金额吗？')) return;
    state.totalEarned = 0; state.todayEarned = 0; state.milestoneReached = 0;
    state.sessionStart = Date.now();
    render(); save();
  });

  $('addBtn').addEventListener('click', () => {
    const before = state.totalEarned;
    state.totalEarned += MILESTONE;
    state.todayEarned += MILESTONE;
    state.milestoneReached++;
    playCoinSound(); spawnCoins(22);
    showMilestone(state.totalEarned);
    amountEl.classList.add('bump');
    setTimeout(() => amountEl.classList.remove('bump'), 160);
    checkMilestone(before, state.totalEarned);
    render(); save();
  });
}

// ========== 可见性 ==========
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    save(); // 切后台时保存
  } else {
    // 切回前台：优先校正，再做离线补偿
    if (state.startWorkDate) {
      autoCorrectFromStartDate();
    } else if (state.bgCalc) {
      compensateOffline();
    }
    state.lastTick = Date.now();
    checkNewDay();
  }
});

// beforeunload 也保存一次
window.addEventListener('beforeunload', save);
window.addEventListener('pagehide', save);

// ========== 音频解锁 ==========
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start();
  } catch(e) {}
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

// ========== 初始化 ==========
function init() {
  load();
  checkNewDay();
  buildWeekdaySelector();
  bindInputs();
  bindButtons();

  // 优先用"开始日期理论值"校正（更精确）
  const corrected = autoCorrectFromStartDate();

  // 再做离线增量补偿（处理本次关闭期间的分钟级增量）
  if (state.bgCalc && state.savedAt && !corrected) {
    compensateOffline();
  } else if (state.bgCalc && state.savedAt && corrected) {
    // 已经校正过了，但仍需更新 savedAt
    state.savedAt = Date.now();
  }

  state.lastTick = Date.now();
  render();

  // tick 循环
  setInterval(tick, 500);
  // 定期保存
  setInterval(save, 5000);
  // 每10秒做一次轻量状态刷新 + 周期性校正
  setInterval(() => {
    state.lastTick = Date.now();
    checkNewDay();
    // 每10秒也做一次轻量校正（防止长时间挂机有微小漂移）
    if (state.startWorkDate) {
      autoCorrectFromStartDate();
    }
    render();
  }, 10000);
}

window.addEventListener('DOMContentLoaded', init);

// ========== PWA 安装 ==========
let deferredPrompt = null;
const installBtn = document.createElement('button');
installBtn.className = 'btn btn-secondary';
installBtn.id = 'installBtn';
installBtn.textContent = '📲 安装到手机';
installBtn.style.display = 'none';

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // 在底部按钮区插入安装按钮
  const btnRow = document.querySelector('.btn-row');
  if (btnRow && !document.getElementById('installBtn')) {
    btnRow.parentNode.insertBefore(installBtn, btnRow.nextSibling);
  }
  installBtn.style.display = '';
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log('安装选择:', outcome);
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  console.log('✅ App 已安装');
  installBtn.style.display = 'none';
  deferredPrompt = null;
  // 安装后隐藏提示
  const hint = document.querySelector('.hint');
  if (hint) hint.style.display = 'none';
});

// 注册 Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      console.log('SW registered:', reg.scope);
    }).catch((err) => {
      console.log('SW failed:', err);
    });
  });
}
</script>
